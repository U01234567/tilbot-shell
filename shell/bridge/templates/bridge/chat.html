{% extends "base.html" %}
{% block page_class %}chat{% endblock %}
{% block content %}
  {% if bot_url %}
    <iframe src="{{ bot_url }}" title="{{ study.name }}"></iframe>
  {% else %}
    <p class="notice">No Tilbot project is linked yet. Put its id in project/project.toml and restart the shell (docs/operations.md).</p>
  {% endif %}
  <form method="post" action="{% url 'sign_out' %}">
    {% csrf_token %}
    <button type="submit" class="quiet">{{ study.texts.sign_out }}</button>
  </form>
{% endblock %}
