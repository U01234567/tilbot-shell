{% extends "base.html" %}
{% block title %}{{ study.texts.sign_in }} · {{ study.name }}{% endblock %}
{% block content %}
  <h1>{{ study.texts.sign_in }}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit">{{ study.texts.sign_in }}</button>
  </form>
  <p><a href="{% url 'sign_up' %}">{{ study.texts.no_id_yet }}</a></p>
{% endblock %}
