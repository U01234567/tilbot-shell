# Phase 2: the results a participant sees beside the chat, once every question is answered.
# Leave this file out for a study without results.
# Tilbot's flowchart opens them: a connector with the event "Message to parent window", message show_results
# (docs/architecture.md). The shell computes each scale from the latest answers; nothing passes through Tilbot.

[texts]
results = "Your results"   # the panel's title, and the button that opens it again
intro = "This is how the past week went for you."
worth_discussing = "Worth discussing"   # the label on an orange bar
none = "There are no results yet: answer all the questions first."
back = "Back to the chat"   # shown on phones, where the results cover the chat

# One [[scales]] per bar. The bar is green when the score is fine and orange past the threshold;
# the track behind it shows both zones, with a thick line at the threshold.
# items      ids from questionnaire.toml; a scale is shown once at least half of them are answered
# higher     "better" or "worse": what a higher score means for the participant
# reverse    true when a high answer on the items means a low score (for example "trouble walking" on a
#            scale of functioning); leave it out otherwise
# threshold  optional, 0–100: worth discussing below it (higher = "better") or above it (higher = "worse")
# The score is the mean of the answers' places on their scales, times 100: the EORTC QLQ-C30 method.

[[scales]]
id = "example"
name = "Example scale"
items = ["Q01", "Q02"]
higher = "worse"
threshold = 50
