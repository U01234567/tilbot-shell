commit = "042f4edb26fb1d727e95a4ee72d1abcbdb8ff45a"
pinned_on = 2026-11-25
upstream_version = "2.1.0"   # "version" in Tilbot's package.json
patches = [
  "0001-forward-participant",
  "0002-shell-logger",
  "0003-fix-embed-cross-origin",
  "0004-fix-variable-sql-injection",
  "0005-browser-editor",
  "0008-fix-dashboard-icons",
  "0009-study-theme",
  "0010-quiet-console",
  "0011-chat-chart",
  "0012-fix-header-flash",
  "0013-markdown-without-html",
  "0014-fix-random-row-variable",
  "0015-fix-random-row-in-message",
  "0016-fix-password-change-reply",
  "0017-fix-message-indent",
  "0018-fix-log-choice-questions",
]
note = "Tilbot 2.1, the newest commit on 25 Nov 2026. Patches redone against a zip of it. 0006 (admin password) and 0007 (clickable links) are gone: Tilbot 2.1 does both itself."

